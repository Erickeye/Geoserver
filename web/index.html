<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣鄉鎮市區地圖 - GeoServer 練習</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: "Microsoft JhengHei", sans-serif; }
    #map { height: 100%; }
    .panel { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.4); font-size: 13px; }
    .panel label { display: block; margin-top: 4px; }
    .panel select { width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  // 預設走同源的 /geoserver（由 serve.py 轉送，不需 CORS）。
  // 想直連 GeoServer 時加 ?gs=http://localhost:8080/geoserver（需先在 GeoServer 啟用 CORS）。
  const GS = new URLSearchParams(location.search).get('gs') || '/geoserver';
  const LAYER = 'taiwan:towns_gpkg';

  const map = L.map('map').setView([23.7, 121], 8);

  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // WMS：GeoServer 依樣式畫成圖片
  const towns = L.tileLayer.wms(`${GS}/taiwan/wms`, {
    layers: LAYER,
    styles: 'town-county',
    format: 'image/png',
    transparent: true,
    opacity: 0.7
  }).addTo(map);

  L.control.layers({ 'OpenStreetMap': osm }, { '鄉鎮市區 (WMS)': towns }).addTo(map);

  // 控制面板：切換樣式、依縣市篩選（CQL_FILTER）
  const counties = ['臺北市','新北市','基隆市','桃園市','新竹市','新竹縣','苗栗縣','臺中市','彰化縣','南投縣','雲林縣',
    '嘉義市','嘉義縣','臺南市','高雄市','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'];

  const panel = L.control({ position: 'topright' });
  panel.onAdd = () => {
    const div = L.DomUtil.create('div', 'panel');
    div.innerHTML = `
      <label>樣式
        <select id="style">
          <option value="town-county">依縣市分色</option>
          <option value="town-label">單色＋標註</option>
          <option value="town-blue">單色</option>
        </select>
      </label>
      <label>縣市篩選
        <select id="county">
          <option value="">全部</option>
          ${counties.map(c => `<option>${c}</option>`).join('')}
        </select>
      </label>`;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  panel.addTo(map);

  function refresh() {
    const county = document.getElementById('county').value;
    towns.setParams({
      styles: document.getElementById('style').value,
      CQL_FILTER: county ? `COUNTYNAME='${county}'` : null
    });
  }
  document.getElementById('style').onchange = refresh;
  document.getElementById('county').onchange = refresh;

  // WFS：點擊地圖，查詢該點落在哪個鄉鎮
  let highlight = null;
  map.on('click', async (e) => {
    const params = new URLSearchParams({
      service: 'WFS', version: '1.0.0', request: 'GetFeature',
      typeName: LAYER, outputFormat: 'application/json',
      CQL_FILTER: `INTERSECTS(geom, POINT(${e.latlng.lng} ${e.latlng.lat}))`
    });
    try {
      const res = await fetch(`${GS}/taiwan/ows?${params}`);
      const data = await res.json();
      if (highlight) map.removeLayer(highlight);
      if (!data.features.length) return;
      const p = data.features[0].properties;
      highlight = L.geoJSON(data, { style: { color: '#d00', weight: 3, fillOpacity: 0.1 } }).addTo(map);
      L.popup().setLatLng(e.latlng)
        .setContent(`<b>${p.COUNTYNAME} ${p.TOWNNAME}</b><br>${p.TOWNENG}<br>鄉鎮代碼：${p.TOWNCODE}`)
        .openOn(map);
    } catch (err) {
      L.popup().setLatLng(e.latlng).setContent('查詢失敗：' + err.message).openOn(map);
    }
  });
</script>
</body>
</html>
